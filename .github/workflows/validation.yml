name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./... -count=1
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
      - name: Vet
        run: go vet ./...
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Benchmark smoke
        run: go test ./... -run '^$' -bench . -benchtime=100ms -count=1
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local